# Template for secrets.yaml — copy to secrets.yaml and fill in real values.
#
#   cp secrets.example.yaml secrets.yaml
#
# secrets.yaml is git-ignored and must never be committed: it carries the
# WiFi credentials in clear text plus the keys that authenticate the device.

# --- Required: WiFi -------------------------------------------------------
wifi_ssid: "YourWiFiSSID"
wifi_password: "YourWiFiPassword"

# --- Required: native API encryption key ----------------------------------
# Generate one with:
#   docker exec esphome esphome config --show-secrets dummy.yaml
# or from the ESPHome dashboard ("Host -> ... -> Download encryption key").
# The config references it as !secret api_key; without it the build fails.
api_key: "REPLACEME_base64_32byte_key"

# --- OTA ------------------------------------------------------------------
# Only used when the config has `password:` under the ota block. If you switch
# the config to `encryption:` (recommended — see README) this is unused.
ota_password: "your_ota_password"

# --- Optional: fallback access point ---------------------------------------
# Only used if the config declares `ap:` under wifi. Without it the captive
# portal stays unreachable.
ap_password: "your_fallback_ap_password"
